<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recuperar contraseña - Manguito</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --surface: #17130F;
    --surface-2: #1C1611;
    --line: rgba(251, 247, 240, 0.12);
    --text: #EFE6DC;
    --muted: #A09488;
    --primary: #FB923C;
    --accent-bg: rgba(251, 247, 240, 0.04);
    --sun: #FBBF24;
    --ember: #EA580C;
    --coral: #FB7185;
    --grad-sun: linear-gradient(135deg, #F59E0B 0%, #F97316 52%, #EA580C 100%);
    --grad-mark: linear-gradient(135deg, #EA580C 0%, #F97316 58%, #FBBF24 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(90% 60% at 50% -10%, rgba(251, 191, 36, 0.12), transparent 60%),
      radial-gradient(120% 120% at 50% 0%, #17130F 0%, #0F0D0B 70%);
    color: var(--text);
    font-family: 'Plus Jakarta Sans', Inter, sans-serif;
    padding: 1.5rem;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 1.4rem;
    padding: 2rem 1.6rem 1.6rem;
    box-shadow: 0 25px 60px rgba(0,0,0,0.6);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-weight: 800;
    font-size: 1.1rem;
    margin-bottom: 1.4rem;
  }
  .brand-mark {
    width: 2rem; height: 2rem;
    border-radius: 0.6rem;
    background: var(--grad-mark);
    display: grid; place-items: center;
    font-size: 0.9rem;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 0.35rem;
  }
  .sub {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 1.4rem;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
  }
  input {
    width: 100%;
    min-height: 2.7rem;
    padding: 0 0.9rem;
    border-radius: 0.75rem;
    border: 1px solid var(--line);
    background: var(--accent-bg);
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
  }
  input:focus { border-color: rgba(251, 146, 60, 0.6); }
  button {
    min-height: 2.9rem;
    border-radius: 0.75rem;
    border: none;
    background: var(--grad-sun);
    color: #fff;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { filter: brightness(1.1); }
  .msg {
    font-size: 0.85rem;
    margin-top: 0.2rem;
    min-height: 1.2em;
  }
  .msg.ok { color: #34d399; }
  .msg.err { color: #f87171; }
  .msg.info { color: #A09488; }
  .step { display: none; }
  .step.active { display: flex; }
  .back {
    display: inline-block;
    margin-top: 1rem;
    font-size: 0.82rem;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
  }
  .resend {
    background: none;
    border: none;
    color: var(--primary);
    font-size: 0.8rem;
    cursor: pointer;
    text-decoration: underline;
    min-height: auto;
    padding: 0.2rem 0;
  }
  @media (max-width: 768px) {
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    .back { display: inline-flex; align-items: center; min-height: 44px; }
    .resend { display: inline-flex; align-items: center; min-height: 44px; padding: 0 0.2rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
<script>(function(){var o=window.fetch.bind(window);window.fetch=function(u,opt){opt=opt||{};opt.headers=Object.assign({},opt.headers||{},{"X-Requested-With":"sv"});return o(u,opt);};})();</script></head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-mark">MG</div>
    <span>Manguito</span>
  </div>
  <h1>Recuperar contraseña</h1>
  <p class="sub">Te enviaremos un código de 6 dígitos a tu email para verificar tu identidad.</p>

  <div class="step active" id="step-1">
    <form id="form-email">
      <label for="email">Email de tu cuenta</label>
      <input id="email" type="email" placeholder="tu@email.com" required>
      <button type="submit">Enviar código</button>
      <p class="msg" id="msg-1"></p>
    </form>
  </div>

  <div class="step" id="step-2">
    <form id="form-code">
      <label for="code">Código de 6 dígitos</label>
      <input id="code" placeholder="123456" maxlength="6" required>
      <label for="newpass">Nueva contraseña</label>
      <input id="newpass" type="password" placeholder="8+ caracteres, mayúscula, número y símbolo" required>
      <button type="submit">Cambiar contraseña</button>
      <p class="msg" id="msg-2"></p>
      <button type="button" class="resend" id="btn-resend">Reenviar código</button>
    </form>
  </div>

  <div class="step" id="step-3">
    <p class="msg ok" style="font-size:1rem">✅ Contraseña actualizada correctamente.</p>
    <p class="sub">Ya podés iniciar sesión con tu nueva contraseña.</p>
    <button type="button" onclick="window.location.href='index.html'">Volver al inicio</button>
  </div>

  <a class="back" href="index.html">← Volver al inicio</a>
</div>

<script>
(function () {
  // En localhost usamos rutas relativas; en GitHub Pages, el backend local del usuario.
  var API = (function () {
    var h = location.hostname;
    var isLocal = (h === 'localhost' || h === '127.0.0.1' || h === '' || location.protocol === 'file:');
    return isLocal ? '/api' : 'http://localhost:3000/api';
  })();
  var emailValue = '';
  var devCode = '';

  function showStep(n) {
    for (var i = 1; i <= 3; i++) {
      var el = document.getElementById('step-' + i);
      if (el) el.classList.toggle('active', i === n);
    }
  }

  function setMsg(id, text, type) {
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = text || '';
    el.className = 'msg ' + (type || '');
  }

  function validEmail(e) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
  }

  document.getElementById('form-email').onsubmit = async function (e) {
    e.preventDefault();
    var email = document.getElementById('email').value.trim().toLowerCase();
    if (!validEmail(email)) { setMsg('msg-1','Ingresá un email válido.','err'); return; }
    emailValue = email;
    setMsg('msg-1','Enviando código…','info');
    try {
      var r = await fetch(API + '/auth/forgot-password', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
      });
      var data = await r.json().catch(function(){ return {}; });
      if (!r.ok) { setMsg('msg-1', (data && data.detail) || 'No se pudo enviar el código.','err'); return; }
      if (data.dev_code) {
        devCode = data.dev_code;
        setMsg('msg-1','(Modo demo: ' + devCode + ')','info');
      } else {
        setMsg('msg-1','');
      }
      if (data.emailSent === false) {
        setMsg('msg-1','No pudimos enviar el email (revisá la configuración de correo). Contactá al administrador.','err');
        return;
      }
      setMsg('msg-1','Si el email está registrado, te enviamos un código a ' + email + '.','info');
      showStep(2);
    } catch (err) {
      setMsg('msg-1','Error de conexión.','err');
    }
  };

  document.getElementById('btn-resend').onclick = async function () {
    if (!validEmail(emailValue)) { setMsg('msg-2','Ingresá primero tu email.','err'); return; }
    setMsg('msg-2','Reenviando…','info');
    try {
      var r = await fetch(API + '/auth/forgot-password', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: emailValue })
      });
      var data = await r.json().catch(function(){ return {}; });
      if (!r.ok) { setMsg('msg-2', (data && data.detail) || 'No se pudo reenviar.','err'); return; }
      if (data.dev_code) devCode = data.dev_code;
      setMsg('msg-2','Código reenviado (si el email existe).','info');
    } catch (err) {
      setMsg('msg-2','Error de conexión.','err');
    }
  };

  document.getElementById('form-code').onsubmit = async function (e) {
    e.preventDefault();
    var code = document.getElementById('code').value.trim();
    var pw = document.getElementById('newpass').value;
    if (!/^\d{6}$/.test(code)) { setMsg('msg-2','El código debe tener 6 dígitos.','err'); return; }
    if (pw.length < 8 || !/[a-z]/.test(pw) || !/[A-Z]/.test(pw) || !/\d/.test(pw) || !/[^A-Za-z0-9]/.test(pw)) {
      setMsg('msg-2','Contraseña insegura: 8+ caracteres, mayúscula, minúscula, número y símbolo.','err');
      return;
    }
    setMsg('msg-2','Verificando…','info');
    try {
      var r = await fetch(API + '/auth/reset-password', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: emailValue, code: code, password: pw })
      });
      var data = await r.json().catch(function(){ return {}; });
      if (!r.ok) { setMsg('msg-2', (data && data.detail) || 'No se pudo cambiar la contraseña.','err'); return; }
      showStep(3);
    } catch (err) {
      setMsg('msg-2','Error de conexión.','err');
    }
  };
})();
</script>
</body>
</html>
