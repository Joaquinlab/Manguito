  <ellipse cx="33.0" cy="28.4" rx="2.8" ry="1.6" fill="#ea2d14" opacity="0.42"/>

  <!-- ojos -->
  <ellipse cx="18.1" cy="22.0" rx="3.15" ry="3.95" fill="#0a0705"/>
  <ellipse cx="29.9" cy="22.0" rx="3.15" ry="3.95" fill="#0a0705"/>
  <!-- reflejos -->
  <circle cx="19.3" cy="20.3" r="1.05" fill="#ffffff"/>
  <circle cx="31.1" cy="20.3" r="1.05" fill="#ffffff"/>
  <circle cx="17.4" cy="23.9" r="0.55" fill="#ffffff" opacity="0.85"/>
  <circle cx="29.2" cy="23.9" r="0.55" fill="#ffffff" opacity="0.85"/>

