  <!-- tallito y hojita -->
  <path d="M24.4 6.4 C24.7 4.5 24.9 3.2 24.8 1.9" fill="none" stroke="#5a2d0c" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M24.8 2.1 C27.0 1.3 29.2 2.0 30.0 3.7 C27.6 4.8 25.4 4.0 24.8 2.1 Z" fill="#22c55e" stroke="#15803d" stroke-opacity="0.45" stroke-width="0.4"/>

  <!-- brillo superior -->
  <ellipse cx="18.5" cy="14.5" rx="6.5" ry="5" fill="url(#mg-gloss)"/>

  <!-- cachetes ruborizados -->
