<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Manguito">
  <defs>
    <radialGradient id="mg-halo" cx="50%" cy="44%" r="56%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.55"/>
      <stop offset="68%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mg-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb066"/>
      <stop offset="42%" stop-color="#f97316"/>
      <stop offset="78%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="mg-gloss" cx="36%" cy="26%" r="46%">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- halo cálido -->
  <circle cx="24" cy="23" r="23" fill="url(#mg-halo)"/>
  <!-- aura inferior -->
  <ellipse cx="24" cy="41.5" rx="12" ry="2.6" fill="#ea580c" opacity="0.42"/>

  <!-- cuerpo -->
  <path d="M24 5.5 C33.6 5.5 39.6 13.1 39.6 21.6 C39.6 31.2 33.4 38.2 24 38.2 C14.6 38.2 8.4 31.2 8.4 21.6 C8.4 13.1 14.4 5.5 24 5.5 Z" fill="url(#mg-body)"/>
